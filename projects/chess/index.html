<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  :root {
    --bg: #0b0a0d; --panel: #16131b; --panel2: #1d1a24; --edge: #2b2634; --edge2: #5a5268;
    --ink: #ece6d6; --dim: #8d869a; --amber: #ffc53d; --green: #5cf2b0; --red: #ff5c6c;
    --light: #d3d7cf; --dark: #8b4513; --sel: #009999; --dot: #660066; --cap: #ff5c6c;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { display: flex; flex-direction: column; font: 18px/1.2 "VT323", ui-monospace, Menlo, monospace; }
  button {
    font: 8px "Press Start 2P", ui-monospace, monospace; color: var(--ink);
    background: var(--panel); border: 2px solid var(--edge); padding: 7px 8px;
    box-shadow: 2px 2px 0 #000; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .top {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
    padding: 6px 8px; background: var(--panel2); border-bottom: 2px solid var(--edge);
  }
  #status { font: 9px "Press Start 2P", ui-monospace, monospace; color: var(--green); }
  #status.check { color: var(--red); }
  #status.over { color: var(--amber); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .main {
    flex: 1 1 auto; min-height: 0; display: flex; flex-wrap: wrap; gap: 12px;
    align-items: flex-start; justify-content: center; padding: 10px; overflow: auto;
  }
  .board {
    display: grid; grid-template-columns: repeat(8, 1fr); container-type: inline-size;
    width: min(94vw, calc(100vh - 84px), 520px); aspect-ratio: 1;
    border: 3px solid var(--edge2); background: #000;
  }
  .sq {
    position: relative; display: grid; place-items: center; margin: 0; padding: 0;
    border: 0; border-radius: 0; box-shadow: none; background: var(--light);
    font-size: 8.2cqi; color: #000; line-height: 1; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .sq.dk { background: var(--dark); }
  .sq .pc { pointer-events: none; font-family: "DejaVu Sans", "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols2", sans-serif; }
  .sq .coord { position: absolute; font: 7px "Press Start 2P", monospace; color: #3a3630; pointer-events: none; }
  .sq.dk .coord { color: #e9d8c1; }
  .sq .coord.rk { left: 2px; top: 2px; }
  .sq .coord.fl { right: 3px; bottom: 2px; }
  .sq.sel { background: var(--sel) !important; }
  .sq.chk { background: var(--cap) !important; }
  .sq.last::before { content: ""; position: absolute; inset: 0; background: rgba(255, 197, 61, .22); pointer-events: none; }
  .sq.tgt.dot::after {
    content: ""; position: absolute; width: 26%; height: 26%; border-radius: 50%;
    background: var(--dot); pointer-events: none;
  }
  .sq.tgt.cap { background: var(--cap) !important; }
  .side {
    flex: 1 1 200px; max-width: 300px; min-width: 0; display: flex; flex-direction: column; gap: 8px;
  }
  .side h3 { font: 9px "Press Start 2P", monospace; color: var(--amber); margin: 6px 0 0; }
  #log {
    flex: 1 1 auto; min-height: 120px; max-height: 300px; overflow: auto;
    border: 2px solid var(--edge); background: #0f0d13; padding: 6px 8px;
    font-size: 18px; line-height: 1.35; color: var(--dim);
  }
  #log .n { color: var(--amber); }
  .hint { color: var(--dim); font-size: 16px; margin: 0; }
  .legend { display: flex; gap: 6px; flex-wrap: wrap; font-size: 16px; color: var(--dim); }
  .legend i { display: inline-block; width: 12px; height: 12px; vertical-align: middle; margin-right: 4px; border: 1px solid #000; }
</style>
</head>
<body>
<div class="top">
  <div id="status" aria-live="polite">WHITE TO MOVE</div>
  <div class="row">
    <button type="button" id="undo">UNDO</button>
    <button type="button" id="flip">FLIP</button>
    <button type="button" id="newGame">NEW GAME</button>
  </div>
</div>
<div class="main">
  <div class="board" id="board" role="grid" aria-label="Chess board"></div>
  <div class="side">
    <h3>MOVES</h3>
    <div id="log" aria-label="Move list"></div>
    <div class="legend">
      <span><i style="background:var(--sel)"></i>selected</span>
      <span><i style="background:var(--dot)"></i>move</span>
      <span><i style="background:var(--cap)"></i>capture / check</span>
    </div>
    <p class="hint">Two players share this screen. Tap a piece, then a highlighted square. Pawns promote to queen. Castling and en passant are not in the original, so they are not here.</p>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
