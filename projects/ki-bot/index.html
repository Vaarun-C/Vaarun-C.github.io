<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ki Spawn Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0a0d;
    --panel: #17141d;
    --panel2: #221d2b;
    --line: #2b2634;
    --ink: #ece6d6;
    --dim: #8d869a;
    --amber: #ffc53d;
    --green: #5cf2b0;
    --red: #ff5c6c;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font: 13px/1.45 "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  #app { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 7px 10px; background: var(--panel); border-bottom: 2px solid #000;
    font: 9px "Press Start 2P", ui-monospace, monospace; color: var(--dim);
  }
  header .chan { color: var(--ink); }
  header .sp { flex: 1; }
  #log { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 10px; }
  .m { display: flex; gap: 9px; padding: 5px 0; align-items: flex-start; }
  .av {
    flex: 0 0 auto; width: 30px; height: 30px; display: grid; place-items: center;
    font: 10px "Press Start 2P", monospace; color: #0b0a0d; border: 2px solid #000;
  }
  .mb { min-width: 0; flex: 1; }
  .hd { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .nm { font-weight: 600; }
  .bot {
    font: 7px "Press Start 2P", monospace; padding: 2px 4px; background: var(--green); color: #0b0a0d;
  }
  .ts { color: var(--dim); font-size: 11px; }
  .txt { white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .ping { color: var(--amber); background: rgba(255, 197, 61, .12); padding: 0 3px; }
  .you-tag { color: var(--amber); }
  .embed {
    margin-top: 5px; border-left: 4px solid var(--c, var(--green)); background: var(--panel);
    padding: 8px 10px; max-width: 440px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px;
  }
  .embed > .btns { grid-column: 1 / -1; }
  .embed h4 { margin: 0; grid-column: 1 / -1; font: 9px "Press Start 2P", monospace; color: var(--ink); line-height: 1.5; }
  .embed p { margin: 0; grid-column: 1 / -1; color: #c9c2d3; }
  .pix {
    width: 64px; height: 64px; background: #0e0c12; border: 2px solid #000; display: grid; place-items: center;
    font: 18px "Press Start 2P", monospace; color: var(--c, var(--green)); grid-row: span 2;
    background-image: repeating-linear-gradient(45deg, #0e0c12 0 6px, #110f16 6px 12px);
  }
  .fields { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px 10px; font-size: 12px; }
  .fields span b { color: var(--dim); font-weight: 400; margin-right: 6px; }
  .foot { grid-column: 1 / -1; color: var(--dim); font-size: 11px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .btn {
    font: 9px "Press Start 2P", monospace; color: var(--ink); background: var(--panel2);
    border: 2px solid var(--line); padding: 7px 8px; cursor: pointer; touch-action: manipulation;
  }
  .btn:not(:disabled):hover { border-color: var(--amber); color: var(--amber); }
  .btn.g { color: var(--green); border-color: var(--green); }
  .btn.a { color: var(--amber); border-color: var(--amber); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  footer {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 7px 10px; background: var(--panel); border-top: 2px solid #000;
  }
  .chip {
    font: 12px "IBM Plex Mono", monospace; color: var(--green); background: transparent;
    border: 1px solid var(--line); padding: 4px 8px; cursor: pointer; touch-action: manipulation;
  }
  .chip:not(:disabled):hover { border-color: var(--green); }
  .chip:disabled { opacity: .4; cursor: default; }
  .chip.spawn { color: var(--amber); }
  .chip.spawn:not(:disabled):hover { border-color: var(--amber); }
  .hint { color: var(--dim); font-size: 11px; margin-left: auto; }
  @media (max-width: 520px) {
    .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span>Demo server</span><span>›</span><span class="chan"># spawns</span>
    <span class="sp"></span>
    <span>fictional users · simulated spawns</span>
  </header>
  <div id="log" role="log" aria-live="polite" aria-label="Channel messages"></div>
  <footer id="composer" aria-label="Commands">
    <button class="chip spawn" id="spawnBtn" type="button">spawn a wild pokémon</button>
    <button class="chip" type="button" data-cmd="mylist-make">/mylist Make</button>
    <button class="chip" type="button" data-cmd="mylist-show">/mylist Show</button>
    <button class="chip" type="button" data-cmd="mylist-clear">/mylist Clear</button>
    <button class="chip" type="button" data-cmd="track">/track</button>
    <span class="hint">taps only · buttons on messages do the rest</span>
  </footer>
</div>

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);

  const log = $("log");

  const chars = (s) => Array.from(s);
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const scroll = () => { log.scrollTop = log.scrollHeight; };

  // Text with "@Name" tokens highlighted as pings.
  function fillText(el, text) {
    el.textContent = "";
    for (const part of text.split(/(@[A-Za-z]+)/)) {
      if (!part) continue;
      const who = part.startsWith("@") ? Object.values(USERS).find((u) => u.name === part.slice(1)) : null;
      if (who) {
        const s = document.createElement("span");
        s.className = who === USERS.you ? "ping you-tag" : "ping";
        s.textContent = part;
        el.appendChild(s);
      } else {
        el.appendChild(document.createTextNode(part));
      }
    }
  }

  // One channel message: avatar, name, optional BOT tag, and a body element.
  function row(author, body) {
    const m = document.createElement("div");
    m.className = "m";
    const av = document.createElement("div");
    av.className = "av";
    av.style.background = author.color;
    av.setAttribute("aria-hidden", "true");
    av.textContent = author.name[0].toUpperCase();
    const mb = document.createElement("div");
    mb.className = "mb";
    const hd = document.createElement("div");
    hd.className = "hd";
    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = author.name;
    hd.appendChild(nm);
    if (author.bot) {
      const t = document.createElement("span");
      t.className = "bot";
      t.textContent = "BOT";
      hd.appendChild(t);
    }
    const ts = document.createElement("span");
    ts.className = "ts";
    ts.textContent = clock();
    hd.appendChild(ts);
    mb.append(hd, body);
    m.append(av, mb);
    log.appendChild(m);
    scroll();
    return mb;
  }

  function say(author, text) {
    const p = document.createElement("div");
    p.className = "txt";
    fillText(p, text);
    row(author, p);
    return p;
  }

  function button(label, cls, onClick) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn " + (cls || "");
    b.textContent = label;
    if (onClick) b.addEventListener("click", onClick);
    return b;
  }

  function buttonRow(parent, buttons) {
    const r = document.createElement("div");
    r.className = "btns";
    r.append(...buttons);
    parent.appendChild(r);
    return r;
  }

  // Resolves with the id of whichever button is clicked first, then disables all of them.
  function choose(parent, options) {
    return new Promise((resolve) => {
      const bs = options.map((o) => button(o.label, o.cls, () => {
        bs.forEach((b) => (b.disabled = true));
        resolve(o.id);
      }));
      buttonRow(parent, bs);
      scroll();
    });
  }

  // Embed: coloured left edge, title, description, pixel placeholder, fields, footer.
  function embed(parent, opts) {
    const e = document.createElement("div");
    e.className = "embed";
    e.style.setProperty("--c", opts.color || "#5cf2b0");
    const h = document.createElement("h4");
    h.textContent = opts.title || "";
    if (!opts.title) h.style.display = "none";
    e.appendChild(h);
    if (opts.pix) { const p = document.createElement("div"); p.className = "pix"; p.textContent = opts.pix; p.setAttribute("aria-hidden", "true"); e.appendChild(p); }
    const dsc = document.createElement("p");
    dsc.textContent = opts.desc || "";
    if (!opts.desc) dsc.style.display = "none";
    e.appendChild(dsc);
    const f = document.createElement("div");
    f.className = "fields";
    e.appendChild(f);
    if (opts.fields) setFields(f, opts.fields);
    const ft = document.createElement("div");
    ft.className = "foot";
    ft.textContent = opts.footer || "";
    if (!opts.footer) ft.style.display = "none";
    e.appendChild(ft);
    parent.appendChild(e);
    scroll();
    return { el: e, fields: f, foot: ft, title: h, desc: dsc };
  }
  function setFields(container, fields) {
    container.textContent = "";
    for (const [k, v] of fields) {
      const s = document.createElement("span");
      const b = document.createElement("b");
      b.textContent = k;
      s.append(b, document.createTextNode(v));
      container.appendChild(s);
    }
  }

  // ---------- hints and identification ----------
  // The spawn reveals letters over three hints. Forms ("Alolan", "Galarian") are shown in full.
  function makeHints(name) {
    let form = "", base = name;
    const sp = name.indexOf(" ");
    if (sp > 0 && SPECIAL.includes(name.slice(0, sp))) { form = name.slice(0, sp); base = name.slice(sp + 1); }
    const cs = chars(base);
    const order = shuffle(cs.map((c, i) => (c === " " ? -1 : i)).filter((i) => i >= 0));
    return [0.3, 0.6, 1].map((f) => {
      const keep = new Set(order.slice(0, Math.max(1, Math.round(order.length * f))));
      const masked = cs.map((c, i) => (c === " " ? " " : keep.has(i) ? c : "_")).join("");
      return `The pokémon is ${form ? form + " " : ""}${masked}.`;
    });
  }

  // Port of what_pokemon() from cogs/catching.py. Feed it one hint at a time.
  // Returns { done: false, candidates } while more than one name fits, else { done: true, name }.
  function feedHint(st, hint) {
    let toks = hint.split(" ");
    toks = toks.slice(toks.indexOf("is") + 1);
    toks[toks.length - 1] = toks[toks.length - 1].replace(/\.$/, "");
    toks = toks.map((t) => t.replace(/\\/g, ""));

    // Special forms: a fully shown first word that is in the form list, e.g. "Alolan". A partly
    // masked word is never a form, otherwise "_a__" from "Tapu" would wrongly match "Pa'u".
    if (toks.length > 1 && !toks[0].includes("_")) {
      const pre = toks[0];
      const form = SPECIAL.find((f) => f === pre);
      if (form) { st.form = form; toks = toks.slice(1); }
    }

    const pattern = toks.join(" ");
    const pc = chars(pattern);
    if (st.possible === null) {
      st.possible = NAMES.map((n) => n[0]).filter((n) => chars(n).length === pc.length);
    }
    st.possible = st.possible.filter((n) => {
      const nc = chars(n);
      return pc.every((c, i) => c === "_" || nc[i] === c);
    });

    if (st.possible.length > 1) return { done: false, candidates: st.possible.slice() };
    if (st.possible.length === 1) return { done: true, name: (st.form ? st.form + " " : "") + st.possible[0], base: st.possible[0] };
    return { done: true, name: null };
  }

  // ---------- user list ----------
  const PAGE = 25;
  function listEmbedPages(user) {
    const list = user.list;
    const pages = [];
    const desc = user.track
      ? "Ki will mention you if a pokemon from this list spawns"
      : "***Ki is not tracking your uncaught pokemon***. Use the /track command to start tracking";
    for (let start = 0; start < list.length; start += PAGE) {
      const end = Math.min(list.length, start + PAGE);
      const fields = list.slice(start, end).map((n, i) => [String(start + i + 1), n]);
      pages.push({
        title: start === 0 ? `${user.name}'s List` : null,
        desc: start === 0 ? desc : null,
        fields,
        footer: `Showing entries ${start + 1}-${end} out of ${list.length}`,
      });
    }
    return pages;
  }

  function showPage(view, pages, i) {
    const p = pages[i];
    view.title.textContent = p.title || "";
    view.title.style.display = p.title ? "" : "none";
    view.desc.textContent = p.desc || "";
    view.desc.style.display = p.desc ? "" : "none";
    view.foot.textContent = p.footer;
    setFields(view.fields, p.fields);
  }

  // ---------- commands ----------
  let busyMake = false;

  function echo(cmd) {
    say(USERS.you, cmd);
  }

  async function cmdMakeList() {
    if (busyMake) return;
    busyMake = true;
    echo("/mylist manage: Make");
    const you = USERS.you;
    you.list = null;   // the original clears the old list first
    await sleep(300);
    say(KI, "Open list of pokemon");
    const stored = [];
    for (let page = 0; page < OWNED_PAGES.length; page++) {
      const names = OWNED_PAGES[page];
      stored.push(...names);
      const last = page === OWNED_PAGES.length - 1;
      const view = embed(log, {
        color: "#ffc53d",
        title: `Pokédex · page ${page + 1} of ${OWNED_PAGES.length}`,
        fields: names.map((n, i) => [String(page * names.length + i + 1), n]),
      });
      await choose(view.el, [{ id: "next", label: last ? "save my list" : "next page", cls: last ? "g" : "" }]);
    }
    you.list = stored.slice();
    await sleep(300);
    say(KI, `${you.name}, your list of pokemon is successfully stored`);
    busyMake = false;
  }

  function cmdShowList() {
    echo("/mylist manage: Show");
    const you = USERS.you;
    if (!you.list || you.list.length === 0) { say(KI, "List is empty"); return; }
    say(KI, `@you your list is`);
    const pages = listEmbedPages(you);
    let i = 0;
    const view = embed(log, { color: "#5cf2b0", fields: [] });
    showPage(view, pages, 0);
    const prev = button("◀️", "", () => { if (i > 0) { i--; showPage(view, pages, i); } });
    const next = button("▶️", "", () => { if (i < pages.length - 1) { i++; showPage(view, pages, i); } });
    buttonRow(view.el, [prev, next]);
    scroll();
  }

  function cmdClearList() {
    echo("/mylist manage: Clear");
    say(KI, "Clearing list...");
    USERS.you.list = null;
    say(KI, "you your list is cleared");
  }

  function cmdTrack() {
    echo("/track");
    USERS.you.track = true;
    say(KI, "Ki is now tracking your uncaught pokemon @you.");
  }

  // ---------- spawns ----------
  let spawning = false;

  async function spawn(forced) {
    if (spawning) return;
    spawning = true;
    spawnBtn.disabled = true;

    const name = forced || pick(POOL);
    const hints = makeHints(name);
    const spawnView = embed(log, {
      color: "#b48cff",
      title: "A wild pokémon has appeared!",
      pix: "?",
      desc: "Type `catch <name>` to claim it.",
    });
    scroll();
    await sleep(700);

    // Hint loop: Ki keeps reading hints until one name fits.
    const st = { possible: null, form: "" };
    let guess = null, base = null;
    for (const hint of hints) {
      say(SPAWNER, hint);
      await sleep(450);
      const r = feedHint(st, hint);
      if (r.done) { guess = r.name; base = r.base; break; }
      const shown = r.candidates.slice(0, 12).join(", ") + (r.candidates.length > 12 ? ` …+${r.candidates.length - 12}` : "");
      say(KI, `Found ${r.candidates.length} possible pokémon`);
      say(KI, shown);
      await sleep(900);   // the original waits 8 s before asking again
    }

    if (!guess) {
      say(KI, "Could not place this one. Session terminated");
      spawning = false; spawnBtn.disabled = false;
      return;
    }

    const info = BY_NAME.get(base) || {};
    embed(log, {
      color: "#5cf2b0",
      title: `Identified: ${guess}`,
      pix: guess[0],
      desc: `Region ${info.region || "?"} · tier ${info.tier || "?"}`,
    });
    await sleep(400);

    // Reminder for users without a list (the original does this in its except branch).
    if (USERS.you.list === null) {
      const u = USERS.you;
      const pingText = u.mentionNoList ? `@you you haven't made a list yet! Use the /mylist command to make one.` : `you haven't made a list yet! Use the /mylist command to make one.`;
      const body = say(KI, pingText);
      buttonRow(body, [button(u.mentionNoList ? "Don't mention me" : "mention me", "a", () => {
        u.mentionNoList = !u.mentionNoList;
        say(KI, `Ki will ${u.mentionNoList ? "" : "not "}mention you if you happen to have no list saved`);
      })]);
      await sleep(400);
    }

    // Who wants it: users whose list has the name and who are tracking uncaught pokemon.
    const pinged = Object.entries(USERS).filter(([, u]) => u.list && u.list.includes(guess) && u.track);
    if (pinged.length === 0) {
      say(KI, `Nobody here has ${guess} on their list, so Ki is leaving it alone.`);
      spawning = false; spawnBtn.disabled = false;
      return;
    }

    const names = pinged.map(([, u]) => (u === USERS.you ? "@you" : `@${u.name}`));
    const body = say(KI, `Wait ${names.join(", ")} need${pinged.length === 1 ? "s" : ""} to catch this`);
    const stopTrack = button("Don't track my uncaught pokémon", "a", () => {
      USERS.you.track = false;
      stopTrack.disabled = true;
      say(KI, "Ki is not tracking your uncaught pokemon anymore @you.\nUse the /track command to start tracking again");
    });
    buttonRow(body, [stopTrack]);
    await sleep(300);

    // The catch itself. In the bot, the spawner posts "Congratulations" and Ki updates the list.
    const options = pinged.map(([id, u]) => ({ id, label: `${u.name} catches it`, cls: "g" }));
    options.push({ id: "none", label: "let it go", cls: "" });
    const who = await choose(body, options);

    if (who === "none") {
      say(KI, "Session terminated");
    } else {
      const u = USERS[who];
      say(SPAWNER, `Congratulations ${u === USERS.you ? "@you" : "@" + u.name}! You caught a ${guess}!`);
      await sleep(300);
      const idx = u.list.indexOf(guess);
      if (idx >= 0) u.list.splice(idx, 1);
      say(KI, `${u === USERS.you ? "@you" : "@" + u.name}, ${guess} has been removed from your list`);
    }

    spawning = false;
    spawnBtn.disabled = false;
  }

  // ---------- wiring ----------
  spawnBtn.addEventListener("click", () => spawn());
  document.querySelectorAll("[data-cmd]").forEach((b) => {
    b.addEventListener("click", () => {
      const c = b.dataset.cmd;
      if (c === "mylist-make") cmdMakeList();
      else if (c === "mylist-show") cmdShowList();
      else if (c === "mylist-clear") cmdClearList();
      else if (c === "track") cmdTrack();
    });
  });

  (async () => {
    say(KI, "Ki is online and watching #spawns. This demo server and its people are made up, and the spawns are simulated. The name matching is the bot's own logic.");
    await sleep(900);
    await spawn("Pikachu");
  })();
})();
</script>
</body>
</html>
