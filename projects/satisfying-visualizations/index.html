<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satisfying Loops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0a0d;
    --panel: #17141d;
    --panel2: #221d2b;
    --line: #2b2634;
    --ink: #ece6d6;
    --dim: #8d869a;
    --amber: #ffc53d;
    --green: #5cf2b0;
    --canvas: #050408;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { display: flex; flex-direction: column; font: 18px/1.2 "VT323", ui-monospace, Menlo, monospace; }
  #tabs {
    flex: 0 0 auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    padding: 6px 8px; background: var(--panel); border-bottom: 2px solid #000;
  }
  .tab {
    font: 9px "Press Start 2P", ui-monospace, monospace; color: var(--dim);
    background: transparent; border: 2px solid var(--line); padding: 7px 8px; cursor: pointer;
    touch-action: manipulation;
  }
  .tab:hover { color: var(--ink); border-color: var(--dim); }
  .tab[aria-selected="true"] { color: var(--bg); background: var(--amber); border-color: var(--amber); }
  #stage { flex: 1 1 auto; min-height: 0; position: relative; background: var(--canvas); }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  #bar {
    flex: 0 0 auto; display: flex; gap: 6px 14px; align-items: center; flex-wrap: wrap;
    padding: 6px 10px; background: var(--panel); border-top: 2px solid #000; color: var(--dim);
  }
  #bar output { color: var(--amber); }
  #bar select, button.small {
    font: 18px "VT323", ui-monospace, monospace; color: var(--ink); background: var(--panel2);
    border: 2px solid var(--line); padding: 2px 8px; cursor: pointer;
  }
  button.small:hover, #bar select:hover { border-color: var(--amber); color: var(--amber); }
  button:focus-visible, select:focus-visible, .tab:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
</style>
</head>
<body>
<nav id="tabs" role="tablist" aria-label="Visualisations"></nav>
<div id="stage"><canvas id="c" aria-label="Animated visualisation"></canvas></div>
<div id="bar">
  <span id="hint"></span>
  <span id="ctl"></span>
</div>

<script>
(() => {
  // Two visualisations ported from the satisfying-visualizations repo (box.py and polyrythms.py).
  // Pygame coordinates (y down) are used throughout, with one persistent buffer per sim.
  const TAU = Math.PI * 2;
  const $ = (id) => document.getElementById(id);
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));   // random.randint, inclusive
  const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
  const lerpColour = (a, b, t) => [0, 1, 2].map((i) => Math.trunc(a[i] + t * (b[i] - a[i])));

  const buf = document.createElement("canvas");
  const bctx = buf.getContext("2d");
  const setBuf = (w, h) => { buf.width = w; buf.height = h; };

  // Volume is shared. box.py and polyrythms.py each kept their own, but starting at 0.5 both.
  let volume = 0.5;
  const setVolume = (v) => { volume = Math.min(1, Math.max(0, Math.round(v * 100) / 100)); };

  // Audio. Synthesised stand-ins for the repo's mp3 files and pygame sine notes.
  let ac = null;
  function audio() {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
    }
    if (ac && ac.state === "suspended") ac.resume().catch(() => {});
    return ac && ac.state === "running" ? ac : null;
  }
  // generate_note: a 0.1 s sine at the given frequency, set_volume(volume) on top of 0.5 full scale.
  function tone(freq, dur, amp) {
    const a = audio();
    if (!a || amp <= 0) return;
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(amp, t);
    g.gain.setValueAtTime(amp, t + dur - 0.004);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.01);
  }
  // Stand-in for durm.mp3: a short pitched-down thump.
  function clack() {
    const a = audio();
    if (!a || volume <= 0) return;
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.9 * volume, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + 0.2);
  }

  // ---------- BoXeS (box.py) ----------
  // Outer frame, one inner box that bounces off it. Nothing is cleared, so the inner box leaves a trail.
  const box = {
    name: "BoXeS", W: 900, H: 800, hint: "↑ ↓ volume", tickMs: 60,
    init() {
      setBuf(this.W, this.H);
      bctx.fillStyle = rgb([128, 128, 128]);
      bctx.fillRect(0, 0, this.W, this.H);
      this.colour = [30, 30, 30];
      this.dir = [1, 1, 1];
      this.ud = -1; this.lr = 1;
      this.x = rnd(100, 500); this.y = rnd(200, 400);
      this.acc = 0;
    },
    tick(dt) {
      // pygame.time.delay(60) per frame in the original, so one step per 60 ms.
      this.acc += dt * 1000;
      let n = 0;
      while (this.acc >= this.tickMs && n < 10) { this.step(); this.acc -= this.tickMs; n++; }
      if (n === 10) this.acc = 0;
    },
    step() {
      const C = this.colour, D = this.dir;
      // new_colour(): counter = 10, one random channel moves each frame.
      const i = rnd(0, 2);
      if (C[i] >= 230 || C[i] <= 0) D[i] *= -1;
      C[i] += 10 * D[i];

      // pygame.Rect(0.2*W+5, 0.1*H+5, 0.6*W, 0.8*H), width 5 border drawn inside the rect.
      const O = { l: 185, t: 85, r: 725, b: 725 };
      const ix = Math.trunc(this.x), iy = Math.trunc(this.y);
      const I = { l: ix, t: iy, r: ix + 80, b: iy + 80 };

      bctx.lineWidth = 5;
      bctx.strokeStyle = "#fff";
      bctx.strokeRect(O.l + 2.5, O.t + 2.5, O.r - O.l - 5, O.b - O.t - 5);
      bctx.fillStyle = rgb(C);
      bctx.fillRect(I.l, I.t, 80, 80);
      bctx.lineWidth = 2;
      bctx.strokeStyle = rgb([65, 65, 65]);
      bctx.strokeRect(I.l + 1, I.t + 1, 78, 78);

      // colliderect() then the four bounce tests, in the same order as the original.
      const hit = O.l < I.r && O.r > I.l && O.t < I.b && O.b > I.t;
      if (hit) {
        if (O.t >= I.t) { clack(); this.ud *= -1; }
        if (O.b <= I.b) { clack(); this.ud *= -1; }
        if (O.r <= I.r) { clack(); this.lr *= -1; }
        if (O.l >= I.l) { clack(); this.lr *= -1; }
      }

      const inc = this.H / 100;   // inc_value = HEIGHT/100 = 8
      this.x += inc * this.lr;
      this.y += inc * this.ud;
    },
    controls(el) {
      el.innerHTML = "";
      const b = document.createElement("button");
      b.className = "small"; b.textContent = "clear";
      b.addEventListener("click", () => this.init());
      el.appendChild(b);
    },
  };

  // ---------- POLYRHYTHM (polyrythms.py) ----------
  // Fifteen arcs, one slider per arc. Each slider runs at its own speed and plays a note when it
  // crosses the bottom line. All sliders line up again at SYNC_TIME = 300 s.
  const GREY = [192, 192, 192];
  const poly = {
    name: "POLYRHYTHM", W: 900, H: 500, hint: "drag the volume bar · time multiplier",
    mult: 1,
    init() {
      setBuf(this.W, this.H);
      this.time = 0;          // TIME
      this.cool = new Map();  // FREQ_COOLDOWN
    },
    tick(dt) {
      this.time += dt * this.mult;   // clock.tick(FPS)/1000 in the original
      this.draw();
    },
    draw() {
      const W = this.W, H = this.H;
      bctx.fillStyle = "#000";
      bctx.fillRect(0, 0, W, H);

      const start = [0.2 * W, 0.9 * H];
      const end = [0.8 * W, 0.9 * H];
      const cx = start[0] + Math.floor((end[0] - start[0]) / 2);
      const cy = start[1] + Math.floor((end[1] - start[1]) / 2);
      const NUM = 15, THICK = 5;
      const length = end[0] - start[0];
      const radii = [];

      for (let i = 0; i < NUM; i++) {
        const r = Math.floor(length / (2 * NUM)) * (i + 1);
        // pygame.draw.arc(0..pi) over the bounding box: upper half, ring from r-5 to r.
        bctx.strokeStyle = rgb(lerpColour([192, 57, 43], [142, 68, 173], i / (NUM - 1)));
        bctx.lineWidth = THICK;
        bctx.beginPath();
        bctx.arc(cx, cy, r - THICK / 2, Math.PI, TAU);
        bctx.stroke();
        radii.push(r);
      }

      bctx.strokeStyle = "#fff";
      bctx.lineWidth = THICK;
      bctx.beginPath();
      bctx.moveTo(start[0], start[1]);
      bctx.lineTo(end[0], end[1]);
      bctx.stroke();

      this.moveSliders(cx, cy, radii, end[1]);

      // Volume bar, drawn at (20,20,20,250); knob at 20 + 230*(1-volume).
      bctx.fillStyle = rgb(GREY);
      bctx.fillRect(20, 20, 20, 250);
      bctx.fillStyle = "#fff";
      bctx.fillRect(20, 20 + 230 * (1 - volume), 20, 20);
    },
    moveSliders(cx, cy, radii, lineY) {
      const SLIDER_R = 5, THICK = 5, T = this.time;
      radii.forEach((r, i) => {
        const velocity = (TAU * (50 - i)) / 300;   // START_VELOCITY - i over SYNC_TIME
        let angle = (velocity * T) % TAU;
        if (angle > Math.PI) angle = -angle;
        const x = cx - r * Math.cos(angle);
        const y = cy - r * Math.sin(angle);
        bctx.fillStyle = "#fff";
        bctx.beginPath();
        bctx.arc(x, y, SLIDER_R, 0, TAU);
        bctx.fill();

        if (y >= lineY - SLIDER_R) {
          bctx.strokeStyle = rgb(GREY);
          bctx.lineWidth = THICK;
          bctx.beginPath();
          bctx.moveTo(x - 2 * SLIDER_R, lineY);
          bctx.lineTo(x + 2 * SLIDER_R, lineY);
          bctx.stroke();
          if (T > 1) {
            const freq = 120 + (330 - 120) * (i / 14);   // lerp_sound FREQ_START..FREQ_END
            const last = this.cool.get(i);
            if (last === undefined || T - last >= 0.5) {
              tone(freq, 0.1, 0.5 * volume);
              this.cool.set(i, T);
            }
          }
        }
      });
    },
    controls(el) {
      el.innerHTML = "";
      const label = document.createElement("span");
      label.textContent = "time ";
      const sel = document.createElement("select");
      sel.setAttribute("aria-label", "time multiplier");
      for (const m of [1, 4, 16]) {
        const o = document.createElement("option");
        o.value = String(m); o.textContent = `${m}x`;
        sel.appendChild(o);
      }
      sel.value = String(this.mult);
      sel.addEventListener("change", () => { this.mult = Number(sel.value); });
      el.append(label, sel);
    },
  };
  const sims = [box, poly];
  let cur = 0;

  // ---------- page shell ----------
  const tabs = $("tabs"), stage = $("stage"), cv = $("c"), ctx = cv.getContext("2d");
  const hintEl = $("hint"), ctlEl = $("ctl");
  const tabEls = sims.map((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tab";
    b.setAttribute("role", "tab");
    b.textContent = `0${i + 1} ${s.name}`;
    b.addEventListener("click", () => go(i));
    tabs.appendChild(b);
    return b;
  });

  // Browsers only allow audio after a user gesture.
  const unlock = () => { audio(); };

  function go(i) {
    cur = (i + sims.length) % sims.length;
    sims[cur].init();
    tabEls.forEach((b, k) => b.setAttribute("aria-selected", String(k === cur)));
    sims[cur].controls(ctlEl);
    showHint();
  }

  function showHint() {
    hintEl.textContent = `←/→ or swipe to switch · ${sims[cur].hint} · volume ${Math.round(volume * 100)}%`;
  }

  let cw = 0, ch = 0, dpr = 1, L = { s: 1, ox: 0, oy: 0 };
  function fit() {
    dpr = window.devicePixelRatio || 1;
    cw = stage.clientWidth; ch = stage.clientHeight;
    cv.width = Math.max(1, Math.round(cw * dpr));
    cv.height = Math.max(1, Math.round(ch * dpr));
  }
  function layout() {
    const s = sims[cur];
    const k = Math.min(cw / s.W, ch / s.H) * 0.96;
    L = { s: k, ox: (cw - s.W * k) / 2, oy: (ch - s.H * k) / 2 };
  }
  function toLogical(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left - L.ox) / L.s, y: (e.clientY - r.top - L.oy) / L.s };
  }

  function drawFrame() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#050408";
    ctx.fillRect(0, 0, cw, ch);
    const s = sims[cur];
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(buf, L.ox, L.oy, s.W * L.s, s.H * L.s);
  }

  let last = performance.now();
  let lastLabelVolume = -1;
  function frame(now) {
    const dt = Math.min(0.25, (now - last) / 1000);
    last = now;
    sims[cur].tick(dt);
    drawFrame();
    const pct = Math.round(volume * 100);
    if (pct !== lastLabelVolume) { lastLabelVolume = pct; showHint(); }
    requestAnimationFrame(frame);
  }

  // Pointer: volume bar on the polyrhythm, swipe to switch sims.
  let dragging = false, swipe0 = null, dragVol = false;
  const inVolBar = (p) => p.x >= 20 && p.x <= 40 && p.y >= 20 && p.y <= 270;
  cv.addEventListener("pointerdown", (e) => {
    unlock();
    const p = toLogical(e);
    if (sims[cur] === poly && inVolBar(p)) {
      dragVol = true;
      setVolume(1 - (p.y - 20) / 250);
    } else {
      swipe0 = { x: e.clientX, y: e.clientY };
    }
    cv.setPointerCapture(e.pointerId);
    dragging = true;
  });
  cv.addEventListener("pointermove", (e) => {
    if (dragging && dragVol) setVolume(1 - (toLogical(e).y - 20) / 250);
  });
  const endPointer = (e) => {
    if (dragging && swipe0) {
      const dx = e.clientX - swipe0.x, dy = e.clientY - swipe0.y;
      if (Math.abs(dx) > 60 && Math.abs(dy) < 40) go(cur + (dx < 0 ? 1 : -1));
    }
    dragging = false; dragVol = false; swipe0 = null;
  };
  cv.addEventListener("pointerup", endPointer);
  cv.addEventListener("pointercancel", endPointer);

  window.addEventListener("keydown", (e) => {
    unlock();
    if (e.key === "ArrowRight") { e.preventDefault(); go(cur + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setVolume(volume + 0.1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setVolume(volume - 0.1); }
  });

  new ResizeObserver(() => { fit(); layout(); }).observe(stage);
  fit(); layout();
  go(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
