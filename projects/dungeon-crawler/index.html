<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon Maze Escape</title>
<style>
  @font-face {
    font-family: 'MedievalPixel';
    src: url('medieval-pixel.otf') format('opentype');
    font-display: swap;
  }
  :root {
    --bg: #0a0a0c;
    --panel: #14141a;
    --border: #32323c;
    --title: #b4a064;
    --text: #b4b4be;
    --dim: #64646e;
    --hp: #00c832;
    --hp-low: #c80000;
    --warn: #c83232;
    --info: #00bfff;
    --compass: #b450ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: 'MedievalPixel', Georgia, serif;
    font-size: 14px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    width: 100%;
    max-width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px;
    min-height: 0;
    outline: none;
  }
  .hud {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 12px;
    background: var(--panel);
    border: 2px solid var(--border);
    padding: 6px 10px;
  }
  .title { color: var(--title); font-size: 18px; letter-spacing: 1px; margin-right: auto; white-space: nowrap; }
  .stat { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .stat .label { color: var(--dim); }
  .hpbar {
    position: relative;
    width: 150px;
    height: 20px;
    background: #320000;
    border: 2px solid var(--border);
    overflow: hidden;
  }
  .hpfill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: var(--hp); }
  .hptext {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); font-size: 13px; text-shadow: 0 1px 0 #000;
  }
  .slot {
    width: 34px; height: 34px;
    border: 2px solid var(--border);
    background: #0a0a0a;
    display: flex; align-items: center; justify-content: center;
  }
  .slot img { width: 26px; height: 26px; image-rendering: pixelated; }
  .slot.off img { opacity: 0.18; filter: grayscale(1); }
  button {
    font: inherit;
    color: var(--text);
    background: #1c1c24;
    border: 2px solid var(--border);
    padding: 4px 10px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:hover { border-color: var(--title); color: var(--title); }
  button:focus-visible { outline: 2px solid var(--title); outline-offset: 2px; }
  .stage { flex: 1; min-height: 0; display: flex; gap: 8px; }
  .mapwrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    background: #000;
    border: 2px solid var(--border);
    overflow: hidden;
  }
  #map { position: absolute; left: 0; top: 0; display: block; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.74);
    padding: 16px;
    text-align: center;
  }
  .overlay[hidden] { display: none; }
  .card { width: 100%; max-width: 420px; overflow-wrap: anywhere; }
  .stage > *, .side > *, .info, .controls, .log { min-width: 0; max-width: 100%; }
  .lastline, .controls-hint, .log p, .card p { overflow-wrap: anywhere; }
  .card h1 { font-size: 26px; font-weight: normal; color: var(--title); margin: 0 0 10px; letter-spacing: 1px; }
  .card p { margin: 0 0 12px; line-height: 1.35; font-size: 15px; }
  .card .btn-big { font-size: 16px; padding: 8px 16px; }
  .card .hint { color: var(--dim); font-size: 12px; margin: 10px 0 0; }
  .side {
    width: 200px;
    flex: 0 0 200px;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--panel);
    border: 2px solid var(--border);
    padding: 8px;
    overflow: hidden;
  }
  .info { display: flex; flex-direction: column; gap: 4px; min-height: 0; flex: 1 1 auto; }
  .facing { color: #d4b35c; font-size: 13px; }
  .lastlabel { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .lastline { color: var(--text); font-size: 13px; line-height: 1.2; }
  .log-title { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .log {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.25;
    scrollbar-width: thin;
  }
  .log p { margin: 0 0 4px; }
  .log .warn { color: var(--warn); }
  .log .good { color: var(--info); }
  .log .ambient { color: var(--info); opacity: 0.85; }
  .log .compass { color: var(--compass); }
  .controls { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
  .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .dpad button { height: 38px; font-size: 18px; padding: 0; }
  .dpad .blank { border: none; background: transparent; }
  .dpad .blank:hover { border-color: transparent; }
  .controls-hint { color: var(--dim); font-size: 11px; line-height: 1.3; }

  /* Narrow iframes / phones: map on top, log and d-pad beneath */
  @media (max-width: 560px) {
    .stage { flex-direction: column; }
    .mapwrap { flex: 0 0 auto; height: min(56vh, calc(100vw - 16px)); width: 100%; }
    .side { width: auto; flex: 1 1 auto; flex-direction: row; }
    .info { flex: 1 1 auto; }
    .controls { width: 128px; justify-content: flex-end; }
    .title { font-size: 16px; white-space: normal; }
    .hpbar { width: 110px; }
    .side { flex-wrap: nowrap; }
    .controls { width: 118px; flex: 0 0 118px; }
  }
  @media (max-height: 340px) {
    .hud { padding: 4px 8px; }
    .title { font-size: 15px; }
    .card h1 { font-size: 20px; margin-bottom: 6px; }
    .card p { font-size: 13px; margin-bottom: 8px; }
  }
</style>
</head>
<body>
<div id="app" tabindex="0">
  <header class="hud">
    <div class="title">DUNGEON MAZE ESCAPE</div>
    <div class="stat"><span class="label">Turn</span><span id="turn">0</span></div>
    <div class="stat">
      <span class="label">HP</span>
      <div class="hpbar" role="meter" aria-label="Health">
        <div class="hpfill" id="hp-fill"></div>
        <div class="hptext" id="hp-text">100/100</div>
      </div>
    </div>
    <div class="stat">
      <span class="slot off" id="slot-key" title="Key"><img src="key.png" alt="Key"></span>
      <span class="slot off" id="slot-compass" title="Compass"><img src="compass.png" alt="Compass"></span>
    </div>
    <button type="button" id="btn-mute" aria-pressed="false">Sound: On</button>
    <button type="button" id="btn-restart">Restart</button>
  </header>

  <main class="stage">
    <div class="mapwrap" id="mapwrap">
      <canvas id="map" role="img" aria-label="Top-down dungeon map. Your position and facing are shown as a green arrow."></canvas>
      <div class="overlay" id="overlay" hidden>
        <div class="card">
          <h1 id="ov-title">DUNGEON MAZE ESCAPE</h1>
          <p id="ov-text"></p>
          <button type="button" class="btn-big" id="ov-btn">Press Enter to Start</button>
          <p class="hint" id="ov-hint"></p>
        </div>
      </div>
    </div>

    <aside class="side">
      <div class="info">
        <div class="facing" id="facing">Facing: NORTH (Up)</div>
        <div class="log-title">MESSAGE LOG</div>
        <div class="log" id="log" aria-live="polite"></div>
        <div class="lastlabel">ACTION LOG</div>
        <div class="lastline" id="last-action">Ready to start.</div>
      </div>
      <div class="controls">
        <div class="dpad" aria-label="On-screen controls">
          <span class="blank"></span>
          <button type="button" data-act="fwd" aria-label="Walk forward">&#9650;</button>
          <span class="blank"></span>
          <button type="button" data-act="left" aria-label="Turn left">&#8634;</button>
          <span class="blank"></span>
          <button type="button" data-act="right" aria-label="Turn right">&#8635;</button>
        </div>
        <div class="controls-hint">Arrows or A/D turn &middot; Up or W walk &middot; M mute &middot; R restart</div>
      </div>
    </aside>
  </main>
</div>
<script src="game.js"></script>
</body>
</html>
